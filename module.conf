# ABK external module metadata.
#
# Keep this file shell-compatible because setup.sh sources it, and keep values
# plain because the ABK app and module catalogs parse it before adding modules.

ABK_MODULE_ID="abk_external_module_template"
ABK_MODULE_NAME="ABK External Module Template"
ABK_MODULE_VERSION="0.2.0"
ABK_MODULE_DESCRIPTION="Template for AnyBase Kernel custom external modules."
ABK_MODULE_REPO_URL="https://github.com/your-name/your-module"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch"

# Optional module-set mode.
# If enabled, the central catalog should only point repoUrl to this repository
# and mark the entry as kind=module_set. The app reads child definitions from
# this file and expands them into flat workflow items.
#
# ABK_MODULE_KIND="module_set"
# ABK_MODULE_SET_ID="security_suite"
# ABK_MODULE_SET_NAME="Security Suite"
# ABK_MODULE_SET_VERSION="0.1.0"
# ABK_MODULE_SET_DESCRIPTION="Aggregate several security feat/fix children in one repository."
#
# Format for each ABK_MODULE_SET_ITEMS line:
# child_id|name|description|repo_url|supported_stages|default_stage|recommended_stages|group_role|controllable|has_web_ui
#
# ABK_MODULE_SET_ITEMS='
# feat_selinux_guard|SELinux Guard|Harden SELinux path checks.|https://github.com/your-name/your-module|after_patch,before_build|after_patch|after_patch|feat|true|false
# fix_policy_cleanup|Policy Cleanup|Clean redundant policy grants.|https://github.com/your-name/your-module|before_build|before_build|before_build|fix|false|false
# '
